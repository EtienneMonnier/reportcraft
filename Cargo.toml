[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/EtienneMonnier/reportcraft"

[workspace.dependencies]
# internal
reportcraft-core = { path = "crates/core" }
reportcraft-barcode = { path = "crates/barcode" }
reportcraft-expr = { path = "crates/expr" }
reportcraft-model = { path = "crates/model" }
reportcraft-data = { path = "crates/data" }
reportcraft-sqlite = { path = "crates/sqlite" }
reportcraft-postgres = { path = "crates/postgres" }
reportcraft-layout = { path = "crates/layout" }
reportcraft-pdf = { path = "crates/pdf" }
reportcraft-office = { path = "crates/office" }
reportcraft-connections = { path = "crates/connections" }
reportcraft-sqlserver = { path = "crates/sqlserver" }
reportcraft-ui-egui = { path = "crates/ui-egui" }
reportcraft-engine = { path = "crates/engine" }
reportcraft-mcp = { path = "crates/mcp" }

# foundation (same versions as the sibling apps)
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
# SQLite source (native only: the bundled C library does not build for wasm). `limits` caps
# ATTACH, `hooks` gives the progress handler that enforces the time limit, `column_decltype` the
# declared column types.
rusqlite = { version = "0.41", features = ["bundled", "limits", "hooks", "column_decltype"] }
# PostgreSQL source (native only): the pure-Rust synchronous client.
postgres = "0.19"
# TLS for PostgreSQL (and later SQL Server), in Rust: rustls with the ring provider (no system
# library), the system's certificate authorities for `sslmode=verify-full`.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"] }
rustls-native-certs = "0.8"
# SQL Server source (native only), pure Rust: the TDS driver with rustls for TLS, on a small
# tokio runtime the source runs itself (its API stays synchronous, like the other sources).
tiberius = { version = "0.13", default-features = false, features = ["tds73", "rustls", "chrono"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "macros"] }
tokio-util = { version = "0.7", default-features = false, features = ["compat"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# PDF writing: the suite's shared writer, pinned to the craft-libs revision GridCraft uses. It
# needs the patched Krilla below (a compile-time marker rejects the crates.io one).
craft-pdf = { git = "https://github.com/storytold/craft-libs", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7", version = "=0.1.0", default-features = false, features = ["write", "write-simple-text"] }
# Printing: the suite's spooler (CUPS `lp`, the Windows XPS print API), same craft-libs revision.
craft-print = { git = "https://github.com/storytold/craft-libs", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7", version = "=0.1.0" }
# Named connections: the suite's settings file, and the OS keychain for passwords (pure-Rust
# backends by default: Secret Service over zbus, macOS Keychain, Windows Credential Manager).
craft-i18n = { git = "https://github.com/storytold/craft-libs", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7", version = "=0.1.0" }
craft-settings = { git = "https://github.com/storytold/craft-libs", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7", version = "=0.1.0" }
keyring = "4.2"
# Picture decoding (PNG, JPEG) for DOCX export, the designer's preview and checking a picture
# before the PDF embeds it: the decoders Krilla already uses, so there is one copy of each.
png = "0.18"
zune-jpeg = "0.5"
# Office export (decided: crates.io writers, MIT/Apache-2.0; GridCraft and WordCraft writers are
# tied to their apps' models). DOCX draws shapes and pictures as images; XLSX leaves them out for now.
rust_xlsxwriter = { version = "0.102", default-features = false, features = ["chrono"] }
docx-rs = { version = "0.4.22", default-features = false }
# The designer (L6 and up only): egui on the suite's fork, the revisions craft-libs pins (patched
# below), and native file dialogs.
egui = { version = "0.37", default-features = false }
eframe = { version = "0.37", default-features = false }
rfd = "0.17"
# All date/time conversion goes through chrono (AGENTS.md).
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde", "unstable-locales"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

# Cargo ignores a dependency's own patches: the patched Krilla that craft-pdf requires comes from
# the same craft-libs revision (unwind cleanup, print colour, optional content).
[patch.crates-io]
# The suite's egui fork and its native event bridge, at the revisions craft-libs c5a1cbf pins.
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
krilla = { git = "https://github.com/storytold/craft-libs", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7", version = "=0.8.2" }

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0
