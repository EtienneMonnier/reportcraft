allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true

# The web build (wasm32-unknown-unknown) has no clock: these trap instead of returning.
# Read the clock only off wasm and allow the lint at that call.
disallowed-methods = [
    { path = "std::time::Instant::now", reason = "traps on wasm; read the clock only off wasm" },
    { path = "std::time::SystemTime::now", reason = "traps on wasm; read the clock only off wasm" },
]
cognitive-complexity-threshold = 30
